  <text class="cls-1" transform="translate(63.7 42.04)"><tspan x="0" y="0">Después de tantos momentos</tspan><tspan x="-14.5" y="49">compartidos, sueños cumplidos</tspan><tspan x="16.77" y="98">y aventuras por vivi</tspan><tspan class="cls-2" x="362.98" y="98">r</tspan><tspan x="374.15" y="98">, hemos</tspan><tspan x="-63.7" y="147">decidido dar el siguiente paso juntos.</tspan></text>
